services:
  db:
    image: postgres:16-alpine
    container_name: intexfin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: intexfin
      POSTGRES_PASSWORD: intexfin
      POSTGRES_DB: intexfin
    ports:
      - "5432:5432"
    volumes:
      - intexfin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intexfin -d intexfin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intexfin-pgdata:
